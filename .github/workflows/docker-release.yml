name: docker-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from file
        run: echo "APP_VERSION=$(cut -d '|' -f 2 ./service/assets/version)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image archive (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: sun-panel:${{ env.APP_VERSION }}
          provenance: false
          outputs: type=docker,dest=sun-panel_${{ env.APP_VERSION }}_amd64.tar

      - name: Build image archive (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: sun-panel:${{ env.APP_VERSION }}
          provenance: false
          outputs: type=docker,dest=sun-panel_${{ env.APP_VERSION }}_arm64.tar

      - name: Compress archives
        run: gzip -9 sun-panel_${{ env.APP_VERSION }}_amd64.tar sun-panel_${{ env.APP_VERSION }}_arm64.tar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Sun-Panel v${{ env.APP_VERSION }}
          files: sun-panel_${{ env.APP_VERSION }}_*.tar.gz
          generate_release_notes: true
          body: |
            ## 使用方法

            按机器架构下载对应的镜像压缩包，导入并运行：

            ```bash
            docker load -i sun-panel_${{ env.APP_VERSION }}_amd64.tar.gz
            docker run -d --name sun-panel -p 3002:3002 --restart always \
              -v sun-panel-conf:/app/conf \
              -v sun-panel-db:/app/database \
              -v sun-panel-uploads:/app/uploads \
              sun-panel:${{ env.APP_VERSION }}
            ```

            arm64 机器请下载 `_arm64.tar.gz` 包。
